name: Plugin

# The tv-ui plugin image (ghcr.io/ciniva/ciniva-tizen-ui) serves src/ to TVs through Ciniva. Pull requests test it;
# a v<VERSION> tag publishes the image tagged <VERSION> and latest; a manual run publishes an image tagged by commit.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches VERSION and ui.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }
          grep -q "\"version\": \"$v\"" src/ui.json || { echo "::error::src/ui.json version is not $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: plugin
      - run: cargo test --locked
        working-directory: plugin

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The interface signing key (UI_SIGNING_KEY) lives in the `release` environment: every image reaches TVs as code.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign the interface
        env:
          UI_SIGNING_KEY: ${{ secrets.UI_SIGNING_KEY }}
        run: |
          if [ -z "$UI_SIGNING_KEY" ]; then echo "::error::UI_SIGNING_KEY is not set; TVs would refuse this image"; exit 1; fi
          node scripts/sign-ui.js
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ciniva/ciniva-tizen-ui
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
