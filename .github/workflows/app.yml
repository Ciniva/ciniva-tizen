name: App

# Pull requests and manual runs build an unsigned .wgt (artifact). Releases are signed and published by release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Version
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Check (Tizen 5.5 runs Chromium 69)
        run: sh scripts/check.sh
      # Unsigned: test builds are signed where they're installed (see README).
      - name: Package
        run: |
          wgt="Ciniva-$VERSION-tizen.wgt"
          (cd src && zip -q -r -X "../$wgt" .)
          echo "WGT=$wgt" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciniva-${{ env.VERSION }}-tizen
          path: ${{ env.WGT }}
